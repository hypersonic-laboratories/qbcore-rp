<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body style="display: none">
        <div class="control-panel">
            <!-- Time Control -->
            <div class="section">
                <label class="label">
                    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                    <span>Time: <span id="timeDisplay">12:00</span></span>
                </label>
                <input type="range" class="time-slider" id="timeSlider" min="0" max="23" value="12" />
                <div class="time-labels">
                    <span>00:00</span>
                    <span>12:00</span>
                    <span>23:00</span>
                </div>
            </div>

            <!-- Weather Control -->
            <div class="section">
                <label class="weather-label">Weather</label>
                <div class="weather-grid">
                    <!-- Clear Skies -->
                    <button class="weather-btn active" data-weather="ClearSkies">
                        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <circle cx="12" cy="12" r="5"></circle>
                            <line x1="12" y1="1" x2="12" y2="3"></line>
                            <line x1="12" y1="21" x2="12" y2="23"></line>
                            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                            <line x1="1" y1="12" x2="3" y2="12"></line>
                            <line x1="21" y1="12" x2="23" y2="12"></line>
                            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                        </svg>
                        <span>Clear</span>
                    </button>

                    <!-- Cloudy -->
                    <button class="weather-btn" data-weather="Cloudy">
                        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"></path>
                        </svg>
                        <span>Cloudy</span>
                    </button>

                    <!-- Foggy -->
                    <button class="weather-btn" data-weather="Foggy">
                        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path d="M3 15h18M3 19h12M4 11h16a4 4 0 0 0 0-8h-1A7 7 0 0 0 3 9"></path>
                        </svg>
                        <span>Foggy</span>
                    </button>

                    <!-- Overcast -->
                    <button class="weather-btn" data-weather="Overcast">
                        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path d="M5 16h14a4 4 0 0 0 0-8h-1A7 7 0 0 0 5 12"></path>
                        </svg>
                        <span>Overcast</span>
                    </button>

                    <!-- Partly Cloudy -->
                    <button class="weather-btn" data-weather="PartlyCloudy">
                        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <circle cx="6" cy="6" r="3"></circle>
                            <path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"></path>
                        </svg>
                        <span>Partly Cloudy</span>
                    </button>

                    <!-- Rain -->
                    <button class="weather-btn" data-weather="Rain">
                        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <line x1="16" y1="13" x2="16" y2="21"></line>
                            <line x1="8" y1="13" x2="8" y2="21"></line>
                            <line x1="12" y1="15" x2="12" y2="23"></line>
                            <path d="M20 16.58A5 5 0 0 0 18 7h-1.26A8 8 0 1 0 4 15.25"></path>
                        </svg>
                        <span>Rain</span>
                    </button>

                    <!-- Rain Light -->
                    <button class="weather-btn" data-weather="RainLight">
                        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <line x1="12" y1="14" x2="12" y2="20"></line>
                            <path d="M20 16.58A5 5 0 0 0 18 7h-1.26A8 8 0 1 0 4 15.25"></path>
                        </svg>
                        <span>Light Rain</span>
                    </button>

                    <!-- Thunderstorm -->
                    <button class="weather-btn" data-weather="RainThunderstorm">
                        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path d="M19 16.9A5 5 0 0 0 18 7h-1.26a8 8 0 1 0-11.62 9"></path>
                            <polyline points="13 11 9 17 15 17 11 23"></polyline>
                        </svg>
                        <span>Thunderstorm</span>
                    </button>

                    <!-- Sand/Dust Calm -->
                    <button class="weather-btn" data-weather="SandDustCalm">
                        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path d="M2 12h20M4 8h16M6 16h12"></path>
                        </svg>
                        <span>Dust (Calm)</span>
                    </button>

                    <!-- Sand/Dust Storm -->
                    <button class="weather-btn" data-weather="SandDustStorm">
                        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path d="M2 10h20M2 14h20M4 6h12M6 18h10"></path>
                        </svg>
                        <span>Dust Storm</span>
                    </button>

                    <!-- Snow -->
                    <button class="weather-btn" data-weather="Snow">
                        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <line x1="12" y1="2" x2="12" y2="22"></line>
                            <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
                        </svg>
                        <span>Snow</span>
                    </button>

                    <!-- Snow Blizzard -->
                    <button class="weather-btn" data-weather="SnowBlizzard">
                        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path d="M4 10h16M6 14h12M3 6h10M8 18h10"></path>
                        </svg>
                        <span>Blizzard</span>
                    </button>

                    <!-- Light Snow -->
                    <button class="weather-btn" data-weather="SnowLight">
                        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <circle cx="8" cy="8" r="1"></circle>
                            <circle cx="12" cy="12" r="1"></circle>
                            <circle cx="16" cy="8" r="1"></circle>
                            <circle cx="10" cy="16" r="1"></circle>
                        </svg>
                        <span>Light Snow</span>
                    </button>
                </div>
            </div>

            <!-- Aurora Toggle -->
            <div class="section">
                <button class="aurora-toggle" id="auroraToggle">
                    <span>Aurora</span>
                    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </button>
            </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
