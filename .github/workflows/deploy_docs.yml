name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      CONFIG_JSON: qb-core/package.json         # Path to your input project config
      OUTPUT_JSON: qb-core.json                 # Output JSON file name
      JAR_URL: https://github.com/XGEN-OSC/LuaDocGenerator/releases/download/alpha-1.0/LuaDocGenerator-1.0-SNAPSHOT.jar
      JAR_FILE: LuaDocGenerator-1.0-SNAPSHOT.jar

    steps:
      # Step 1: Checkout current repo
      - name: Checkout current repository
        uses: actions/checkout@v4

      # Step 2: Checkout external repo (for static site files)
      - name: Checkout external repository (LuaDocGenerator)
        uses: actions/checkout@v4
        with:
          repository: XGEN-OSC/LuaDocGenerator
          path: external-repo

      # Step 3: Download LuaDocGenerator JAR
      - name: Download LuaDocGenerator JAR
        run: |
          curl -L $JAR_URL -o $JAR_FILE

      # Step 4: Generate documentation JSON
      - name: Run LuaDocGenerator
        run: |
          java -jar $JAR_FILE --project "$CONFIG_JSON" "$OUTPUT_JSON"

      # Step 5: Prepare deployment folder
      - name: Prepare deployment directory
        run: |
          mkdir -p deploy
          cp -r external-repo/view/* deploy/
          cp docviewconfig.js deploy/
          cp "$OUTPUT_JSON" deploy/

      # Step 6: Deploy to GitHub Pages
      - name: Deploy static site to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
