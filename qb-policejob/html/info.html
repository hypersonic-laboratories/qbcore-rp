<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Citizen Information</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #e0e0e0;
        }

        .dialog-box {
            background: #1e1e1e;
            border-radius: 8px;
            width: 500px;
            max-width: 90vw;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .dialog-header {
            padding: 20px 24px;
            border-bottom: 1px solid #333;
        }

        .dialog-title {
            font-size: 20px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 4px;
        }

        .dialog-subtitle {
            font-size: 13px;
            color: #999;
        }

        .dialog-content {
            padding: 16px;
        }

        .section {
            margin-bottom: 16px;
            background: #252525;
            border-radius: 6px;
            overflow: hidden;
        }

        .section-header {
            padding: 12px 16px;
            background: #2a2a2a;
            font-weight: 500;
            font-size: 15px;
        }

        .section-content {
            padding: 12px 16px;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #333;
        }

        .info-item:last-child {
            border-bottom: none;
        }

        .info-label {
            color: #999;
            font-size: 14px;
        }

        .info-value {
            color: #e0e0e0;
            font-size: 14px;
            font-weight: 500;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            padding: 8px 0;
            gap: 10px;
        }

        .checkbox-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #4a9eff;
        }

        .checkbox-item label {
            font-size: 14px;
            color: #e0e0e0;
        }
    </style>
</head>
<body>
    <div class="dialog-box">
        <!-- Header -->
        <div class="dialog-header">
            <div class="dialog-title">John Doe</div>
            <div class="dialog-subtitle">Citizen Information</div>
        </div>

        <!-- Content -->
        <div class="dialog-content">
            <!-- Character Information -->
            <div class="section">
                <div class="section-header">Documentation</div>
                <div class="section-content">
                    <div class="info-item">
                        <span class="info-label">Citizen ID:</span>
                        <span class="info-value">ABC12345</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Birthdate:</span>
                        <span class="info-value">01/15/1990</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Gender:</span>
                        <span class="info-value">Male</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Nationality:</span>
                        <span class="info-value">American</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Phone Number:</span>
                        <span class="info-value">555-0123</span>
                    </div>
                </div>
            </div>

            <!-- Job Information -->
            <div class="section">
                <div class="section-header">Job Information</div>
                <div class="section-content">
                    <div class="info-item">
                        <span class="info-label">Job:</span>
                        <span class="info-value">Police</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Rank:</span>
                        <span class="info-value">Sergeant</span>
                    </div>
                </div>
            </div>

            <!-- Licenses -->
            <div class="section">
                <div class="section-header">Licenses</div>
                <div class="section-content">
                    <div class="checkbox-item">
                        <input type="checkbox" id="driver" checked disabled>
                        <label for="driver">Driver</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="weapon" checked disabled>
                        <label for="weapon">Weapon</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="business" disabled>
                        <label for="business">Business</label>
                    </div>
                </div>
            </div>

            <!-- Criminal Record -->
            <div class="section">
                <div class="section-header">Criminal Record</div>
                <div class="section-content">
                    <div class="checkbox-item">
                        <input type="checkbox" id="criminal-record" disabled>
                        <label for="criminal-record">Criminal Record</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" id="tracker" checked>
                        <label for="tracker">Manage Tracker</label>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        window.addEventListener('message', function(event) {
            const EventName = event.data.name;
            const EventArgs = event.data.args;
            switch (EventName) {
                case 'OpenUI':
                    updateDialog(EventArgs[0]);
                    break;
            }
        });

        function updateDialog(data) {
            const charInfo = data.Character;
            const jobInfo = data.Job;

            // Update header
            document.querySelector('.dialog-title').textContent = charInfo.Name;

            // Update character info
            const charValues = document.querySelectorAll('.section:nth-child(1) .info-value');
            charValues[0].textContent = charInfo.CitizenId;
            charValues[1].textContent = charInfo.Birthdate;
            charValues[2].textContent = charInfo.Gender;
            charValues[3].textContent = charInfo.Nationality;
            charValues[4].textContent = charInfo.PhoneNumber;

            // Update job info
            const jobValues = document.querySelectorAll('.section:nth-child(2) .info-value');
            jobValues[0].textContent = jobInfo.Label;
            jobValues[1].textContent = jobInfo.Grade;

            // Update licenses
            const licensesContent = document.querySelector('.section:nth-child(3) .section-content');
            licensesContent.innerHTML = '';
            for (const [license, obtained] of Object.entries(data.Licenses)) {
                const licenseLabel = license.charAt(0).toUpperCase() + license.slice(1);
                licensesContent.innerHTML += `
                    <div class="checkbox-item">
                        <input type="checkbox" id="${license}" ${obtained ? 'checked' : ''} disabled>
                        <label for="${license}">${licenseLabel}</label>
                    </div>
                `;
            }

            // Update criminal record
            document.getElementById('criminal-record').checked = data.CriminalRecord.hasRecord;
            document.getElementById('tracker').checked = data.Tracker;
            document.body.style.display = 'flex';
        }

        document.getElementById('tracker')?.addEventListener('change', function() {
            const charValues = document.querySelectorAll('.section:nth-child(1) .info-value');
            const CitizenId = charValues[0].textContent;
            hEvent('toggleTracker', CitizenId, this.checked);
        })

        window.addEventListener('mousedown', function(event) {
            // Right click
            if (event.button === 2) {
                hEvent('close');
                document.body.style.display = 'none';
            }
        });
    </script>
</body>
</html>
